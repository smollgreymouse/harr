<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:2px 4px;font-family:inherit;background:transparent;color:inherit;font-size:13px}.card{display:flex;align-items:center;gap:9px;border:1px solid color-mix(in srgb,currentColor 17%,transparent);border-radius:8px;padding:6px 8px;min-height:36px}.dot{width:9px;height:9px;border-radius:50%;background:currentColor;opacity:.55;flex:0 0 auto}.done .dot{opacity:1}.main{min-width:0;flex:1}.title{font-weight:600}.sub{opacity:.58;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}.badge{font-size:11px;border:1px solid color-mix(in srgb,currentColor 17%,transparent);border-radius:999px;padding:2px 7px;opacity:.75;flex:0 0 auto}.done .badge{opacity:1}
</style></head><body><div class="card" id="card"><span class="dot"></span><div class="main"><div class="title" id="title">🟣 Async worker</div><div class="sub" id="sub">initializing…</div></div><span class="badge" id="badge">STARTING</span></div><script>
const panelId='marker-'+Math.random().toString(36).slice(2)+'-'+Date.now().toString(36);let counter=1,pending=new Map(),initialized=false,stopped=false,job=null,watching=false,notified=false;const el=id=>document.getElementById(id);
let lastHeight=0;function reportHeight(){const card=el('card');if(!card)return;const cs=getComputedStyle(document.body);const py=(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0);const h=Math.max(1,Math.ceil(card.getBoundingClientRect().height+py));if(h===lastHeight)return;lastHeight=h;parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/size-changed',params:{height:h}},'*')}
function request(method,params){const id=counter++;return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{if(pending.has(id)){pending.delete(id);reject(Error('timeout '+method))}},20000);pending.set(id,{resolve,reject,timer});parent.postMessage({jsonrpc:'2.0',id,method,params},'*')})}
async function tool(name,args={}){const r=await request('tools/call',{name,arguments:args});if(r?.isError)throw Error('tool failed');return r?.structuredContent||{}}
async function lifecycle(event){if(initialized)try{await tool('probe_attach_ui',{panel_id:panelId,surface:'marker',event,job_id:job?.job_id||''})}catch{}}
function render(j){job=j;const done=j.status==='DONE';el('card').className='card '+(done?'done':'');el('badge').textContent=j.status;el('title').textContent=(done?'✅':'🟣')+' Async worker';const id=(j.job_id||'').slice(0,8);el('sub').textContent=done?id+' · completed '+new Date(j.completed_at).toLocaleTimeString():id+' · running · due '+new Date(j.due_at).toLocaleTimeString();requestAnimationFrame(reportHeight)}
async function deliver(j){if(notified||!j.event_id)return;notified=true;let claim;try{claim=await tool('probe_claim_ui',{panel_id:panelId,event_id:j.event_id})}catch{notified=false;el('sub').textContent='done · claim failed';return}if(!claim.claimed){el('sub').textContent=(j.job_id||'').slice(0,8)+' · completed · already delivered';return}const text='[async-marker-probe] Worker '+j.job_id+' completed at '+j.completed_at+'. Inline completion marker delivered this via ui/message. Result: '+(j.message||'done')+'.';try{await request('ui/message',{role:'user',content:[{type:'text',text}]});await lifecycle('marker_completion_message_sent')}catch{notified=false;try{await tool('probe_release_ui',{panel_id:panelId,event_id:j.event_id})}catch{}el('sub').textContent='done · ui/message failed'}}
async function watch(){if(watching||!job?.job_id||stopped)return;watching=true;try{while(!stopped&&job?.status==='RUNNING'){const r=await tool('probe_wait_job_ui',{panel_id:panelId,job_id:job.job_id,timeout_ms:10000});if(r.job){render(r.job);if(r.job.status==='DONE'){await deliver(r.job);break}}}}catch{if(!stopped){el('sub').textContent='reconnecting…';setTimeout(()=>{watching=false;watch()},800);return}}watching=false}
function attach(d){if(!d||d.surface!=='marker'||!d.job_id)return;render(d);lifecycle('marker_attached').catch(()=>{});watch()}
window.addEventListener('message',ev=>{const o=ev.data||{};if(o.id!==undefined&&pending.has(o.id)){const p=pending.get(o.id);pending.delete(o.id);clearTimeout(p.timer);o.error?p.reject(Error(o.error.message||'request failed')):p.resolve(o.result);return}if(o.method==='ui/notifications/tool-result'||o.method==='ui/notifications/tool-input'){let d=o.params?.result?.structuredContent||o.params?.structuredContent;if(typeof d==='string'){try{d=JSON.parse(d)}catch{}}attach(d)}if(o.method==='ui/resource-teardown'){stopped=true;lifecycle('marker_resource_teardown').catch(()=>{});if(o.id!==undefined)parent.postMessage({jsonrpc:'2.0',id:o.id,result:{}},'*')}});
document.addEventListener('visibilitychange',()=>lifecycle(document.hidden?'marker_hidden':'marker_visible').catch(()=>{}));window.addEventListener('pagehide',()=>{stopped=true;lifecycle('marker_pagehide').catch(()=>{})});
(async()=>{try{await request('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'async-marker-probe-ui',version:'0.2'},capabilities:{},appCapabilities:{}});parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'},'*');initialized=true;reportHeight();new ResizeObserver(()=>reportHeight()).observe(el('card'));requestAnimationFrame(reportHeight);await lifecycle('marker_created')}catch(e){el('sub').textContent='init failed: '+e.message}})();
</script></body></html>
