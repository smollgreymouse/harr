<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:12px;font-family:inherit;background:transparent;color:inherit;font-size:13px}.box{border:1px solid color-mix(in srgb,currentColor 18%,transparent);border-radius:9px;padding:12px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px}.title{font-weight:650}.hint{opacity:.58;font-size:11px;margin-top:3px}.jobs{display:grid;gap:7px;margin-top:12px}.job{border:1px solid color-mix(in srgb,currentColor 13%,transparent);border-radius:7px;padding:8px 9px}.row{display:flex;justify-content:space-between;gap:8px}.name{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.status{font-size:11px;opacity:.7}.msg{opacity:.65;margin-top:3px;overflow-wrap:anywhere}.empty{opacity:.55;padding:18px 4px;text-align:center}
</style></head><body><section class="box"><div class="head"><div><div class="title">Async Workspace probe</div><div class="hint">Persistent side-panel monitor · inline marker owns wake</div></div><span id="seq">seq 0</span></div><div id="jobs" class="jobs"><div class="empty">No jobs yet</div></div></section><script>
const panelId='workspace-'+Math.random().toString(36).slice(2)+'-'+Date.now().toString(36);let counter=1,pending=new Map(),initialized=false,stopped=false,afterSeq=0;const jobsEl=document.getElementById('jobs'),seqEl=document.getElementById('seq');
function request(method,params){const id=counter++;return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{if(pending.has(id)){pending.delete(id);reject(Error('timeout '+method))}},20000);pending.set(id,{resolve,reject,timer});parent.postMessage({jsonrpc:'2.0',id,method,params},'*')})}
async function tool(name,args={}){const r=await request('tools/call',{name,arguments:args});if(r?.isError)throw Error('tool failed');return r?.structuredContent||{}}
async function lifecycle(event){if(initialized)try{await tool('probe_attach_ui',{panel_id:panelId,surface:'workspace',event})}catch{}}
function render(items){jobsEl.innerHTML='';if(!items.length){jobsEl.innerHTML='<div class="empty">No jobs yet</div>';return}[...items].reverse().forEach(j=>{const d=document.createElement('div');d.className='job';const short=(j.job_id||'').slice(0,8);d.innerHTML='<div class="row"><span class="name">'+short+'</span><span class="status">'+j.status+'</span></div><div class="msg"></div>';d.querySelector('.msg').textContent=j.message||'';jobsEl.appendChild(d)})}
async function refresh(){try{const r=await tool('probe_list_jobs_ui');render(r.jobs||[]);if(Number.isInteger(r.latestSeq)){afterSeq=Math.max(afterSeq,r.latestSeq);seqEl.textContent='seq '+afterSeq}}catch{}}
async function loop(){while(!stopped){try{const r=await tool('probe_wait_events_ui',{panel_id:panelId,after_seq:afterSeq,timeout_ms:10000});if(r.event)afterSeq=Math.max(afterSeq,r.event.seq||0);else if(Number.isInteger(r.latestSeq))afterSeq=Math.max(afterSeq,r.latestSeq);seqEl.textContent='seq '+afterSeq;await refresh()}catch{if(!stopped)await new Promise(r=>setTimeout(r,800))}}}
function attach(d){if(d?.surface==='workspace'&&Number.isInteger(d.latestSeq)){afterSeq=Math.max(afterSeq,d.latestSeq);seqEl.textContent='seq '+afterSeq}}
window.addEventListener('message',ev=>{const o=ev.data||{};if(o.id!==undefined&&pending.has(o.id)){const p=pending.get(o.id);pending.delete(o.id);clearTimeout(p.timer);o.error?p.reject(Error(o.error.message||'request failed')):p.resolve(o.result);return}if(o.method==='ui/notifications/tool-result'||o.method==='ui/notifications/tool-input'){let d=o.params?.result?.structuredContent||o.params?.structuredContent;if(typeof d==='string'){try{d=JSON.parse(d)}catch{}}attach(d)}if(o.method==='ui/resource-teardown'){stopped=true;lifecycle('workspace_resource_teardown').catch(()=>{});if(o.id!==undefined)parent.postMessage({jsonrpc:'2.0',id:o.id,result:{}},'*')}});
window.addEventListener('pagehide',()=>{stopped=true;lifecycle('workspace_pagehide').catch(()=>{})});document.addEventListener('visibilitychange',()=>lifecycle(document.hidden?'workspace_hidden':'workspace_visible').catch(()=>{}));
(async()=>{try{await request('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'async-workspace-probe-ui',version:'0.2'},capabilities:{},appCapabilities:{}});parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'},'*');initialized=true;await lifecycle('workspace_created');await refresh();loop()}catch{jobsEl.innerHTML='<div class="empty">init failed</div>'}})();
</script></body></html>
