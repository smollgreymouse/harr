<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:light dark}*{box-sizing:border-box}
body{margin:0;padding:10px;font:inherit;font-size:1rem;line-height:1.45;background:transparent;color:inherit}
#panel{border:1px solid color-mix(in srgb,currentColor 20%,transparent);border-radius:9px;padding:12px}
header{display:flex;align-items:center;justify-content:space-between;font-weight:600;gap:12px}
#status{font-size:.84em;opacity:.75;font-weight:400}
#tabs{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
button{font:inherit;font-size:.85em;background:transparent;color:inherit;border:1px solid color-mix(in srgb,currentColor 24%,transparent);border-radius:5px;padding:3px 7px;cursor:pointer}
button.active{border-color:#a18ce6;background:color-mix(in srgb,#9c81ed 17%,transparent)}
#lines{max-height:410px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.89em;line-height:1.5}
.line{padding:3px 0;border-bottom:1px solid color-mix(in srgb,currentColor 8%,transparent)}
.dim{opacity:.65}.ok{color:#4eba8b}.error{color:#ef7b7b}
.ansi-red{color:#ed6874}.ansi-green{color:#4eba8b}.ansi-yellow{color:#daa849}.ansi-blue{color:#7baef4}.ansi-magenta{color:#ce90ef}.ansi-cyan{color:#69cad6}
</style></head><body><section id="panel"><header><span>🟣 Harr · GigaCode Live</span><span id="status">Подключение…</span></header><div id="tabs"></div><div id="lines"></div></section>
<script>
const $=x=>document.getElementById(x),lines=$('lines'),status=$('status'),tabs=$('tabs');
const panelId='panel-'+Math.random().toString(36).slice(2)+'-'+Date.now().toString(36);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const colors={31:'red',32:'green',33:'yellow',34:'blue',35:'magenta',36:'cyan',91:'red',92:'green',93:'yellow',94:'blue',95:'magenta',96:'cyan'};
function render(s){let out='',kind='',pos=0;for(const m of String(s).matchAll(/\x1b\[([0-9;]*)m/g)){const part=esc(s.slice(pos,m.index));out+=kind?'<span class="ansi-'+kind+'">'+part+'</span>':part;const cs=m[1].split(';').map(Number);if(cs.includes(0)||cs.includes(39))kind='';for(const c of cs)if(colors[c])kind=colors[c];pos=m.index+m[0].length;}const tail=esc(s.slice(pos));return out+(kind?'<span class="ansi-'+kind+'">'+tail+'</span>':tail)}
let id=1,pending=new Map(),sessions=new Map(),selected='',initialized=false,stopped=false;
function request(method,params){const n=id++;return new Promise((resolve,reject)=>{pending.set(n,{resolve,reject});parent.postMessage({jsonrpc:'2.0',id:n,method,params},'*');setTimeout(()=>{if(pending.has(n)){pending.delete(n);reject(new Error('timeout '+method))}},20000)})}
async function appTool(name,args={}){const r=await request('tools/call',{name,arguments:args});if(r.isError)throw Error(JSON.stringify(r.content));return r.structuredContent||{}}
function lifecycle(event,sid=''){if(initialized)appTool('panel_event_ui',{panel_id:panelId,event,session_id:sid}).catch(()=>{})}
function add(sid){if(!sid||sessions.has(sid))return;if(sessions.size>=20)return;sessions.set(sid,{revision:0,messages:[],status:'PENDING',running:false,finished:false});lifecycle('subscribe',sid);if(!selected)selected=sid;drawTabs();poll(sid)}
function drawTabs(){tabs.replaceChildren();for(const [sid,s] of sessions){const b=document.createElement('button');b.textContent=sid.slice(0,8)+' '+s.status;b.className=sid===selected?'active':'';b.title=sid;b.onclick=()=>{selected=sid;drawTabs();drawLines();lifecycle('switch_tab',sid)};tabs.append(b)}const refresh=document.createElement('button');refresh.textContent='↻ Сессии';refresh.onclick=loadSessions;tabs.append(refresh)}
function drawLines(){lines.replaceChildren();const s=sessions.get(selected);status.textContent=s?s.status:'Нет сессий';if(!s)return;for(const e of s.messages){const row=document.createElement('div');row.className='line '+e.kind;row.innerHTML=render(e.text);lines.append(row)}lines.scrollTop=lines.scrollHeight}
function append(sid,text,kind=''){const s=sessions.get(sid);if(!s)return;s.messages.push({text,kind});if(s.messages.length>1000)s.messages.splice(0,s.messages.length-1000);if(selected===sid)drawLines()}
async function poll(sid){const s=sessions.get(sid);if(!s||s.running||s.finished||stopped)return;s.running=true;try{const d=await appTool('poll_gigacode_ui',{session_id:sid,after_revision:s.revision,wait_ms:10000});if(stopped)return;for(const m of d.messages||[])append(sid,m.text||'');s.revision=d.revision??s.revision;s.status=d.status||'UNKNOWN';s.finished=['DONE','FAILED','CANCELLED','ESCALATE','TIMEOUT'].includes(s.status);if(s.finished){append(sid,'— '+s.status+' —',s.status==='DONE'?'ok':'error');lifecycle('completed',sid)}}catch(e){s.status='RECONNECTING';lifecycle('poll_error',sid)}finally{s.running=false;drawTabs();if(sid===selected)drawLines();if(!s.finished&&!stopped)setTimeout(()=>poll(sid),s.status==='RECONNECTING'?3000:250)}}
async function loadSessions(){try{const d=await appTool('list_gigacode_ui');for(const sid of d.sessions||[])add(sid)}catch(e){status.textContent='Session list: '+e.message}}
window.addEventListener('message',ev=>{const o=ev.data||{};if(o.id!==undefined&&pending.has(o.id)){const p=pending.get(o.id);pending.delete(o.id);o.error?p.reject(Error(JSON.stringify(o.error))):p.resolve(o.result);return}
if(o.method==='ui/notifications/tool-result'||o.method==='ui/notifications/tool-input'){let d=o.params?.result?.structuredContent||o.params?.structuredContent||o.params?.result?.content?.[0]?.text;if(typeof d==='string'){try{d=JSON.parse(d)}catch{}}if(d?.session_id)add(d.session_id)}
});
window.addEventListener('pagehide',()=>{stopped=true;lifecycle('pagehide',selected)});
window.addEventListener('beforeunload',()=>{stopped=true;lifecycle('beforeunload',selected)});
document.addEventListener('visibilitychange',()=>{lifecycle(document.hidden?'hidden':'visible',selected)});
(async()=>{try{await request('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'harr-gigacode-ui',version:'0.3'},capabilities:{},appCapabilities:{}});parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'},'*');initialized=true;lifecycle('created');await loadSessions();status.textContent=sessions.size?'Активно':'Ожидание GigaCode'}catch(e){status.textContent='Init: '+e.message}})();
</script></body></html>
