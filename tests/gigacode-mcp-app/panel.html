<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:light dark}*{box-sizing:border-box}
body{margin:0;padding:10px;font:inherit;font-size:1rem;line-height:1.45;background:transparent;color:inherit}
#panel{border:1px solid color-mix(in srgb,currentColor 20%,transparent);border-radius:9px;padding:12px}
header{display:flex;align-items:center;justify-content:space-between;font-size:1em;font-weight:600;margin-bottom:8px;gap:12px}
#status{font-size:.85em;opacity:.75;font-weight:400}
#lines{max-height:410px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.89em;line-height:1.5}
.line{padding:3px 0;border-bottom:1px solid color-mix(in srgb,currentColor 8%,transparent)}
.dim{opacity:.65}.ok{color:#4eba8b}.warn{color:#daa849}.error{color:#ef7b7b}.tool{color:#7baef4}.ansi-red{color:#ed6874}.ansi-green{color:#4eba8b}.ansi-yellow{color:#daa849}.ansi-blue{color:#7baef4}.ansi-magenta{color:#ce90ef}.ansi-cyan{color:#69cad6}
</style></head><body><section id="panel"><header><span>🟣 Harr · GigaCode Live</span><span id="status">Подключение…</span></header><div id="lines" aria-live="polite"></div></section>
<script>
const $=x=>document.getElementById(x), lines=$('lines'),stat=$('status');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const colors={31:'red',32:'green',33:'yellow',34:'blue',35:'magenta',36:'cyan',91:'red',92:'green',93:'yellow',94:'blue',95:'magenta',96:'cyan'};
function render(s){let out='',kind='',pos=0;for(const m of s.matchAll(/\x1b\[([0-9;]*)m/g)){const part=esc(s.slice(pos,m.index));out+=kind?'<span class="ansi-'+kind+'">'+part+'</span>':part;const codes=m[1].split(';').map(Number);if(codes.includes(0)||codes.includes(39))kind='';for(let c of codes)if(colors[c])kind=colors[c];pos=m.index+m[0].length;}const last=esc(s.slice(pos));return out+(kind?'<span class="ansi-'+kind+'">'+last+'</span>':last)}
function append(text,cl=''){const row=document.createElement('div');row.className='line '+cl;row.innerHTML=render(String(text));lines.append(row);lines.scrollTop=lines.scrollHeight}
let pending=new Map(),id=1,sid='',revision=0,running=false;
function request(method,params){const n=id++;return new Promise((resolve,reject)=>{pending.set(n,{resolve,reject});parent.postMessage({jsonrpc:'2.0',id:n,method,params},'*');setTimeout(()=>{if(pending.has(n)){pending.delete(n);reject(new Error(method+' timed out'))}},20000)})}
window.addEventListener('message',ev=>{const o=ev.data||{};if(o.id!==undefined&&pending.has(o.id)){const p=pending.get(o.id);pending.delete(o.id);o.error?p.reject(new Error(o.error.message)):p.resolve(o.result);return;}
if(o.method==='ui/notifications/tool-result'||o.method==='ui/notifications/tool-input'){
let data=o.params?.result?.structuredContent||o.params?.structuredContent||o.params?.result?.content?.[0]?.text;
if(typeof data==='string'){try{data=JSON.parse(data)}catch{}}
if(data?.session_id){sid=data.session_id;append('GigaCode session: '+sid,'dim');if(!running)poll();}
}});
async function poll(){if(running||!sid)return;running=true;try{let res=await request('tools/call',{name:'poll_gigacode_ui',arguments:{session_id:sid,after_revision:revision,wait_ms:10000}});let data=res.structuredContent||{};for(let m of data.messages||[]){append(m.text||'', '');}revision=data.revision??revision;stat.textContent=data.status||'RUNNING';if(['DONE','FAILED','CANCELLED','ESCALATE'].includes(data.status)){running=false;append('— '+data.status+' —','ok');return;}}catch(e){stat.textContent='Poll: '+e.message;}running=false;setTimeout(poll,1200)}
(async()=>{try{const res=await request('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'harr-gigacode-ui',version:'0.1'},capabilities:{},appCapabilities:{}});parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'},'*');stat.textContent='Ожидание session ID';append('UI подключён. Ожидаю результат запуска GigaCode…','dim');}catch(e){stat.textContent='UI init: '+e.message;append('Handshake failed: '+e.message,'error')}})();
</script></body></html>
