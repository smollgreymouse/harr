<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:12px;font-family:inherit;background:transparent;color:inherit;font-size:calc(var(--font-size-base,1rem)*.82);line-height:1.4}.panel{border:1px solid color-mix(in srgb,currentColor 18%,transparent);border-radius:10px;padding:14px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}.title{font-weight:650;font-size:1.08em}.sub,.notice{opacity:.68;font-size:.9em}.badge{padding:2px 8px;border-radius:999px;border:1px solid color-mix(in srgb,currentColor 18%,transparent);white-space:nowrap}.section{margin-top:12px}.label{font-weight:600;margin-bottom:5px}.root{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid color-mix(in srgb,currentColor 8%,transparent)}.path{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere;flex:1}.status{font-size:.82em;opacity:.72}.ok{color:#4eba8b}.bad{color:#ef7b7b}button,input{font:inherit}button{border:1px solid color-mix(in srgb,currentColor 22%,transparent);background:color-mix(in srgb,currentColor 5%,transparent);color:inherit;border-radius:7px;padding:5px 9px;cursor:pointer}button:disabled{opacity:.45;cursor:default}.add{display:flex;gap:7px;margin-top:8px}.add input{flex:1;min-width:0;border:1px solid color-mix(in srgb,currentColor 22%,transparent);border-radius:7px;padding:6px 8px;background:transparent;color:inherit}.error{margin-top:8px;color:#ef7b7b;white-space:pre-wrap}.notice{margin-top:12px}.empty{opacity:.6;padding:6px 0}
</style></head><body><section class="panel"><div class="top"><div><div class="title" id="name">Harr Workspace</div><div class="sub" id="primary"></div></div><div><span class="badge" id="revision">rev —</span> <button id="refresh" type="button">Refresh</button></div></div><div class="section"><div class="label">Additional roots</div><div id="roots"></div><div class="add"><input id="path" type="text" spellcheck="false" placeholder="/path/to/another/project"><button id="add" type="button">Add</button></div><div class="error" id="error"></div></div><div class="notice" id="notice"></div></section><script>
const el=id=>document.getElementById(id);let counter=1,pending=new Map(),snapshot=null,busy=false;
function request(method,params){const id=counter++;return new Promise((resolve,reject)=>{pending.set(id,{resolve,reject});parent.postMessage({jsonrpc:'2.0',id,method,params},'*');setTimeout(()=>{if(pending.has(id)){pending.delete(id);reject(new Error('timeout '+method))}},20000)})}
async function tool(name,args={}){const r=await request('tools/call',{name,arguments:args});if(r?.isError)throw new Error((r.content||[]).map(x=>x.text||'').join('\n')||'tool failed');return r?.structuredContent||{}}
function setBusy(v){busy=v;el('add').disabled=v;el('refresh').disabled=v;for(const b of document.querySelectorAll('[data-remove]'))b.disabled=v}
function setError(v=''){el('error').textContent=v}
function render(s){snapshot=s;el('name').textContent=s.name||'Harr Workspace';el('primary').textContent=s.primary||'';el('revision').textContent='rev '+String(s.revision??'—');el('notice').textContent=s.notice||'';const roots=el('roots');roots.replaceChildren();const rows=(s.roots||[]).filter(r=>r.kind==='additional');if(!rows.length){const d=document.createElement('div');d.className='empty';d.textContent='No additional roots';roots.append(d)}for(const r of rows){const row=document.createElement('div');row.className='root';const path=document.createElement('div');path.className='path';path.textContent=r.path;const st=document.createElement('span');st.className='status '+(r.status==='OK'?'ok':'bad');st.textContent=r.status;const btn=document.createElement('button');btn.type='button';btn.dataset.remove='1';btn.textContent='Remove';btn.onclick=()=>removeRoot(r.path);row.append(path,st,btn);roots.append(row)}setBusy(false)}
async function refresh(){if(busy)return;setBusy(true);setError();try{render(await tool('workspace_ui_get'))}catch(e){setError(e.message);setBusy(false)}}
async function addRoot(){if(busy||!snapshot)return;const path=el('path').value.trim();if(!path)return;setBusy(true);setError();try{render(await tool('workspace_ui_add_root',{path,expected_revision:snapshot.revision}));el('path').value=''}catch(e){setError(e.message);setBusy(false);await refresh()}}
async function removeRoot(path){if(busy||!snapshot)return;setBusy(true);setError();try{render(await tool('workspace_ui_remove_root',{path,expected_revision:snapshot.revision}))}catch(e){setError(e.message);setBusy(false);await refresh()}}
window.addEventListener('message',ev=>{const o=ev.data||{};if(o.id!==undefined&&pending.has(o.id)){const p=pending.get(o.id);pending.delete(o.id);o.error?p.reject(new Error(o.error.message||'request failed')):p.resolve(o.result);return}if(o.method==='ui/notifications/tool-result'||o.method==='ui/notifications/tool-input'){const d=o.params?.result?.structuredContent||o.params?.structuredContent;if(d?.primary)render(d)}});el('add').onclick=addRoot;el('refresh').onclick=refresh;el('path').addEventListener('keydown',e=>{if(e.key==='Enter')addRoot()});
(async()=>{try{await request('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'harr-workspace-ui',version:'0.1'},capabilities:{},appCapabilities:{}});parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'},'*');await refresh()}catch(e){setError(e.message)}})();
</script></body></html>
