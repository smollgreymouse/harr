<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:10px;font-family:inherit;background:transparent;color:inherit;font-size:calc(var(--font-size-base,1rem)*.82);line-height:1.45}.panel{border:1px solid color-mix(in srgb,currentColor 18%,transparent);border-radius:11px;padding:14px;min-width:0}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.title{font-weight:650;font-size:1.08em}.eyebrow{font-size:.78em;letter-spacing:.04em;text-transform:uppercase;opacity:.55;margin-bottom:2px}.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}.pill{padding:2px 7px;border-radius:999px;border:1px solid color-mix(in srgb,currentColor 18%,transparent);white-space:nowrap;font-size:.84em}.state{display:inline-flex;align-items:center;gap:5px}.dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5}.state.ready .dot{color:#4eba8b;opacity:1}.state.error .dot{color:#ef7b7b;opacity:1}.state.busy .dot{color:#daa849;opacity:1}.primary{margin-top:13px;padding:10px 11px;border-radius:8px;background:color-mix(in srgb,currentColor 5%,transparent)}.primary-head,.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.section{margin-top:14px}.section-title{font-weight:600}.count{opacity:.55;font-size:.88em}.path{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere;word-break:break-word}.primary .path{margin-top:4px}.root{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid color-mix(in srgb,currentColor 8%,transparent)}.root:last-child{border-bottom:0}.status{font-size:.8em;opacity:.72}.ok{color:#4eba8b}.bad{color:#ef7b7b}button,input{font:inherit}button{border:1px solid color-mix(in srgb,currentColor 22%,transparent);background:color-mix(in srgb,currentColor 5%,transparent);color:inherit;border-radius:7px;padding:5px 9px;cursor:pointer}button:hover:not(:disabled){background:color-mix(in srgb,currentColor 9%,transparent)}button:disabled{opacity:.42;cursor:default}.danger{border-color:color-mix(in srgb,#ef7b7b 55%,transparent)}.add{display:flex;gap:7px;margin-top:9px}.add input{flex:1;min-width:0;border:1px solid color-mix(in srgb,currentColor 22%,transparent);border-radius:7px;padding:7px 8px;background:transparent;color:inherit}.add input:focus{outline:2px solid color-mix(in srgb,currentColor 24%,transparent);outline-offset:1px}.message{margin-top:10px;padding:7px 9px;border-radius:7px;background:color-mix(in srgb,currentColor 5%,transparent);font-size:.9em;display:none;white-space:pre-wrap}.message.show{display:block}.message.error{color:#ef7b7b}.message.ok{color:#4eba8b}.notice{margin-top:12px;opacity:.6;font-size:.87em}.empty{opacity:.55;padding:9px 0}.hidden{display:none!important}@media(max-width:560px){.top{flex-direction:column}.meta{justify-content:flex-start}.root{grid-template-columns:minmax(0,1fr) auto}.root .action{grid-column:1/-1;justify-self:end}.add{flex-direction:column}.add button{align-self:flex-end}}
</style></head><body><section class="panel" aria-labelledby="title"><div class="top"><div><div class="eyebrow">Harr · LeanCTX</div><div class="title" id="title">Workspace</div></div><div class="meta"><span class="pill state busy" id="state"><span class="dot"></span><span id="stateText">Подключение…</span></span><span class="pill" id="revision">rev —</span><button id="refresh" type="button" aria-label="Обновить Workspace">Обновить</button></div></div><div class="primary"><div class="primary-head"><span class="section-title">Основной корень</span><span class="status" id="primaryStatus">—</span></div><div class="path" id="primary">Ожидание текущего проекта…</div></div><div class="section"><div class="section-head"><span class="section-title">Дополнительные корни</span><span class="count" id="count">0</span></div><div id="roots"></div><div class="add"><input id="path" type="text" spellcheck="false" autocomplete="off" placeholder="/absolute/path/to/project" aria-label="Абсолютный путь дополнительного корня"><button id="add" type="button">Добавить</button></div><div class="message" id="message" role="status" aria-live="polite"></div></div><div class="notice" id="notice">Откройте панель через show_harr_workspace для текущего проекта.</div></section><script>
const el=id=>document.getElementById(id);let counter=1,pending=new Map(),snapshot=null,busy=false,initialized=false,confirmPath='';
function request(method,params){const id=counter++;return new Promise((resolve,reject)=>{pending.set(id,{resolve,reject});parent.postMessage({jsonrpc:'2.0',id,method,params},'*');setTimeout(()=>{if(pending.has(id)){pending.delete(id);reject(new Error('timeout '+method))}},20000)})}
async function tool(name,args={}){const r=await request('tools/call',{name,arguments:args});if(r?.isError)throw new Error((r.content||[]).map(x=>x.text||'').join('\n')||'tool failed');return r?.structuredContent||{}}
function state(kind,text){const box=el('state');box.className='pill state '+kind;el('stateText').textContent=text}
function message(text='',kind=''){const box=el('message');box.textContent=text;box.className='message'+(text?' show':'')+(kind?' '+kind:'')}
function setBusy(v,text='Готово'){busy=v;el('add').disabled=v||!snapshot||!el('path').value.trim();el('refresh').disabled=v||!snapshot;el('path').disabled=v||!snapshot;for(const b of document.querySelectorAll('[data-remove]'))b.disabled=v;state(v?'busy':'ready',v?'Обновление…':text)}
function render(s,{keepMessage=false}={}){snapshot=s;confirmPath='';el('title').textContent=s.name||'Workspace';el('primary').textContent=s.primary||'—';el('revision').textContent='rev '+String(s.revision??'—');el('notice').textContent=s.notice||'';const primary=(s.roots||[]).find(r=>r.kind==='primary');el('primaryStatus').textContent=primary?.status||'—';el('primaryStatus').className='status '+(primary?.status==='OK'?'ok':'bad');const rows=(s.roots||[]).filter(r=>r.kind==='additional');el('count').textContent=String(rows.length);const roots=el('roots');roots.replaceChildren();if(!rows.length){const d=document.createElement('div');d.className='empty';d.textContent='Дополнительных корней пока нет';roots.append(d)}for(const r of rows){const row=document.createElement('div');row.className='root';const path=document.createElement('div');path.className='path';path.textContent=r.path;path.title=r.path;const st=document.createElement('span');st.className='status '+(r.status==='OK'?'ok':'bad');st.textContent=r.status;const btn=document.createElement('button');btn.type='button';btn.dataset.remove='1';btn.className='action';btn.textContent='Удалить';btn.onclick=()=>confirmRemove(r.path,btn);row.append(path,st,btn);roots.append(row)}if(!keepMessage)message();setBusy(false)}
async function refresh({keepMessage=false}={}){if(busy||!snapshot?.project)return;setBusy(true);try{render(await tool('workspace_ui_get',{project:snapshot.project}),{keepMessage})}catch(e){message(e.message,'error');busy=false;setBusy(false,'Ошибка');state('error','Ошибка')}}
function classifyError(e){const t=String(e?.message||e);return /revision|conflict/i.test(t)?'Workspace изменился в другом окне. Загружена актуальная revision.':t}
async function addRoot(){if(busy||!snapshot)return;const path=el('path').value.trim();if(!path){message('Введите абсолютный путь к каталогу.','error');return}setBusy(true);message();try{render(await tool('workspace_ui_add_root',{project:snapshot.project,path,expected_revision:snapshot.revision}));el('path').value='';el('add').disabled=true;message('Корень добавлен.','ok')}catch(e){const text=classifyError(e);busy=false;await refresh({keepMessage:true});message(text,'error')}}
function confirmRemove(path,button){if(busy)return;if(confirmPath!==path){confirmPath=path;for(const b of document.querySelectorAll('[data-remove]')){b.textContent='Удалить';b.classList.remove('danger')}button.textContent='Подтвердить';button.classList.add('danger');message('Повторное нажатие удалит этот корень из Harr Workspace.');return}removeRoot(path)}
async function removeRoot(path){if(busy||!snapshot)return;setBusy(true);message();try{render(await tool('workspace_ui_remove_root',{project:snapshot.project,path,expected_revision:snapshot.revision}));message('Корень удалён.','ok')}catch(e){const text=classifyError(e);busy=false;await refresh({keepMessage:true});message(text,'error')}}
function attach(d){if(!d?.project||!d?.primary)return;render(d)}
window.addEventListener('message',ev=>{const o=ev.data||{};if(o.id!==undefined&&pending.has(o.id)){const p=pending.get(o.id);pending.delete(o.id);o.error?p.reject(new Error(o.error.message||'request failed')):p.resolve(o.result);return}if(o.method==='ui/notifications/tool-result'||o.method==='ui/notifications/tool-input'){let d=o.params?.result?.structuredContent||o.params?.structuredContent;if(typeof d==='string'){try{d=JSON.parse(d)}catch{}}attach(d)}});el('add').onclick=addRoot;el('refresh').onclick=()=>refresh();el('path').addEventListener('input',()=>{el('add').disabled=busy||!snapshot||!el('path').value.trim()});el('path').addEventListener('keydown',e=>{if(e.key==='Enter')addRoot()});
(async()=>{try{await request('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'harr-workspace-ui',version:'0.2'},capabilities:{},appCapabilities:{}});parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'},'*');initialized=true;state('busy','Ожидание Workspace…')}catch(e){state('error','Ошибка init');message(e.message,'error')}})();
</script></body></html>
