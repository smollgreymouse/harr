name: harr-release

on:
  push:
    tags:
      - 'harr-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (artifact-only manual runs)'
        required: true
        default: '0.3.7'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          file_version=$(tr -d '[:space:]' < VERSION)
          if [[ "$GITHUB_REF" == refs/tags/harr-v* ]]; then
            version=${GITHUB_REF_NAME#harr-v}
            [[ "$version" == "$file_version" ]] || {
              echo "Tag version $version does not match VERSION ($file_version)" >&2
              exit 1
            }
          else
            version='${{ inputs.version }}'
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake qt6-base-dev at git dpkg-dev

      - name: Build and test native scheduler
        env:
          QT_QPA_PLATFORM: offscreen
          HARR_CODEX_THEME: dark
        run: |
          cmake -S tools/codex-scheduler -B tools/codex-scheduler/build -DCMAKE_BUILD_TYPE=Release
          cmake --build tools/codex-scheduler/build --target package-release
          tools/codex-scheduler/build/harr-codex-scheduler self-test
          bash tools/codex-scheduler/tests/test_cli.sh
          bash tools/codex-scheduler/tests/test_packaging.sh

      - name: Fetch pinned Harr LeanCTX release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=smollgreymouse/lean-ctx
          source linux/files/harr-cli/components.sh
          tag="$HARR_LEANCTX_RELEASE_TAG"
          build_id="$HARR_LEANCTX_ID"
          target=x86_64-unknown-linux-gnu
          work=$(mktemp -d)
          gh release download "$tag" -R "$repo" -D "$work" \
            -p "lean-ctx-${target}.tar.gz" -p SHA256SUMS
          grep -Eq "^[[:xdigit:]]{64} [ *]lean-ctx-${target}\.tar\.gz$" "$work/SHA256SUMS" || { echo "Missing pinned release checksum" >&2; exit 1; }
          ( cd "$work" && sha256sum -c SHA256SUMS --ignore-missing )
          tar -xzf "$work/lean-ctx-${target}.tar.gz" -C "$work"
          test "$("$work/lean-ctx" --version)" = \
            "lean-ctx 3.11.0 (Harr build ${build_id}, https://github.com/yvgude/lean-ctx)"
          install -D -m 0755 "$work/lean-ctx" dist/vendor/lean-ctx
          sha256sum dist/vendor/lean-ctx > dist/leanctx.sha256

      - name: Verify pinned LeanCTX MCP icon and tools over stdio
        run: python3 tests/leanctx-icon-acceptance.py --binary "$GITHUB_WORKSPACE/dist/vendor/lean-ctx"

      - name: Build full Harr packages
        run: |
          arch=$(dpkg --print-architecture)
          cmake \
            -DHARR_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DHARR_VERSION="${{ steps.version.outputs.version }}" \
            -DHARR_ARCH="$arch" \
            -DHARR_OUTPUT_DIR="$GITHUB_WORKSPACE/dist" \
            -DHARR_ARCHIVE_REF=HEAD \
            -DHARR_BUNDLED_LEANCTX="$GITHUB_WORKSPACE/dist/vendor/lean-ctx" \
            -P packaging/package-harr.cmake

      - name: Verify full Harr packages
        shell: bash
        run: |
          set -euo pipefail
          deb=$(realpath dist/harr_*_*.deb)
          tarball=$(realpath dist/harr-*.tar.gz)
          dpkg-deb --info "$deb" >/dev/null
          tar -tzf "$tarball" > /tmp/harr-tar-listing
          dpkg-deb --contents "$deb" > /tmp/harr-deb-listing
          grep -q '/install.sh$' /tmp/harr-tar-listing
          grep -q '/common/mcp/registry.json$' /tmp/harr-tar-listing
          grep -q '/linux/vendor/lean-ctx/lean-ctx$' /tmp/harr-tar-listing
          grep -q '/usr/lib/harr/linux/vendor/lean-ctx/lean-ctx$' /tmp/harr-deb-listing
          grep -q './usr/bin/harr$' /tmp/harr-deb-listing
          if grep -q './usr/bin/harr-install' /tmp/harr-deb-listing; then
            echo 'Deprecated harr-install entrypoint must not be packaged' >&2
            exit 1
          fi
          grep -q '/usr/lib/harr/linux/install.sh$' /tmp/harr-deb-listing
          root=$(mktemp -d)
          dpkg-deb -x "$deb" "$root"
          grep -q 'HARR_INSTALL_TYPE=package' "$root/usr/bin/harr"
          clean_home=$(mktemp -d)
          # Exercise the real Debian entrypoint so package-mode semantics are
          # covered; calling the internal CLI directly would silently test source mode.
          HOME="$clean_home" XDG_CONFIG_HOME="$clean_home/.config" "$root/usr/bin/harr" version
          test ! -e "$clean_home/.local/bin/lean-ctx"
          HOME="$clean_home" XDG_CONFIG_HOME="$clean_home/.config" "$root/usr/bin/harr" setup --help | grep -q 'Harr Linux setup'

          # Simulate an existing managed launcher from the previous package.
          # The first Harr invocation after upgrade must replace it with the
          # thin package launcher and must not copy the package binary into HOME.
          mkdir -p "$clean_home/.local/bin"
          cat >"$clean_home/.local/bin/lean-ctx" <<'EOF_OLD_LEANCTX'
          #!/usr/bin/env bash
          # HARR_LEANCTX_WRAPPER=1
          exit 99
          EOF_OLD_LEANCTX
          chmod 0755 "$clean_home/.local/bin/lean-ctx"
          HOME="$clean_home" XDG_CONFIG_HOME="$clean_home/.config" "$root/usr/bin/harr" version >/dev/null
          grep -q '^# HARR_PACKAGE_LEANCTX_LAUNCHER=1$' "$clean_home/.local/bin/lean-ctx"
          expected_leanctx_id=$(sed -n 's/^readonly HARR_LEANCTX_ID="\(.*\)"$/\1/p' "$root/usr/lib/harr/linux/files/harr-cli/components.sh")
          expected_leanctx_build=$(sed -n 's/^readonly HARR_LEANCTX_BUILD="\(.*\)"$/\1/p' "$root/usr/lib/harr/linux/files/harr-cli/components.sh")
          test -n "$expected_leanctx_id"
          test -n "$expected_leanctx_build"
          HOME="$clean_home" XDG_CONFIG_HOME="$clean_home/.config" \
            "$clean_home/.local/bin/lean-ctx" --version \
            | grep -Fq "Harr build ${expected_leanctx_id},"
          test ! -e "$clean_home/.local/libexec/harr/vendor/lean-ctx/${expected_leanctx_build}/lean-ctx"
          if grep -q '/tools/codex-scheduler/' /tmp/harr-tar-listing; then
            echo 'Main Harr tarball must not contain Codex Scheduler sources' >&2
            exit 1
          fi
          if grep -q '/usr/lib/harr/tools/codex-scheduler/' /tmp/harr-deb-listing; then
            echo 'Main Harr Debian package must not contain Codex Scheduler sources' >&2
            exit 1
          fi

      - name: Release checksums
        shell: bash
        run: |
          cp tools/codex-scheduler/dist/harr-codex-scheduler_*.deb dist/
          cp tools/codex-scheduler/dist/harr-codex-scheduler-*.tar.gz dist/
          ( cd dist && sha256sum harr_*.deb harr-*.tar.gz harr-codex-scheduler_*.deb > SHA256SUMS )

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: harr-${{ steps.version.outputs.version }}
          path: |
            dist/harr_*.deb
            dist/harr-*.tar.gz
            dist/SHA256SUMS
            dist/harr-codex-scheduler_*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/harr-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/harr_*.deb \
            dist/harr-*.tar.gz \
            dist/harr-codex-scheduler_*.deb \
            dist/SHA256SUMS \
            --title "Harr ${{ steps.version.outputs.version }}" \
            --notes-file "docs/releases/harr-v${{ steps.version.outputs.version }}.md"
