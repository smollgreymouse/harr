name: selftest

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        shell: bash
        run: |
          set -e
          bash -n install.sh uninstall.sh linux/install.sh linux/harr tests/clean-harness.sh
          bash -n linux/files/state/harr-state
          bash -n linux/files/mcp/gitlab-run linux/files/mcp/codegraph-cli linux/files/leanctx/lean-ctx-wrapper
          for f in linux/files/harr-cli/*.sh; do bash -n "$f"; done
      - name: Python syntax
        run: python3 -m py_compile linux/files/hosts/opencode-config.py linux/files/hosts/codex-config.py
      - name: Clean takeover and rollback
        run: bash tests/clean-harness.sh
